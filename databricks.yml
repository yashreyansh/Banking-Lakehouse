bundle:
  name: banking-lakehouse

sync:
  include:
    - "03-streaming-bronze-load-databricks/**/*.py"
  exclude:
    - ".venv/**"
    - "00-synthetic-data-generation/**"
    - "checkpoints/**"
    - "**/__pycache__/**"
    - "**/*.pyc"
    - ".env"
    - "*.json"
    - "*.html"
    - "*.md"
    - "*.txt"


targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405608251876154.14.azuredatabricks.net
  prod:
    mode: Production
    default: false
    workspace:
      host: https://adb-7405615519498491.11.azuredatabricks.net/

resources:
  pipelines:
    banking_bronze_dlt:
      name: banking-bronze-declarative-pipeline
      catalog: banking_lakehouse
      schema: banking_bronze
      serverless: true
      continuous: true
      libraries:
        - notebook:
            path: ./03-streaming-bronze-load-databricks/bronze_transaction_stream.py
      configuration:
        eh_namespace: "banking-lakehouse-eventhub-transactions"
        eh_txn_name: "transactioneventhub"

    banking_silver_dlt:
      name: banking-silver-declarative-pipeline
      catalog: banking_lakehouse
      schema: banking_silver
      serverless: true
      continuous: true
      libraries:
        - notebook:
            path: ./04-streaming-silver-load-databricks/silver_transaction_stream.py


  jobs:
    banking_bronze_dlt_job:
      name: banking-bronze-dlt-trigger
      max_concurrent_runs: 1 
      tasks:
        - task_key: run_dlt_pipeline
          max_retries: 0 
          pipeline_task:
            pipeline_id: ${resources.pipelines.banking_bronze_dlt.id}
    
    banking_silver_dlt_job:
      name: banking-silver-dlt-trigger
      max_concurrent_runs: 1
      tasks:
        - task_key: run_dlt_silver_pipeline
          max_retries: 0
          pipeline_task:
            pipeline_id: ${resources.pipelines.banking_silver_dlt.id}