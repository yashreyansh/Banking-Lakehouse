bundle:
  name: banking-lakehouse

sync:
  include:
    - "databricks/**/*.py"
  exclude:
    - ".venv/**"
    - "00-synthetic-data-generation/**"
    - "checkpoints/**"
    - "**/__pycache__/**"
    - "**/*.pyc"
    - ".env"
    - "*.json"
    - "*.html"
    - "*.md"
    - "*.txt"

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405615519498491.11.azuredatabricks.net/
  prod:
    mode: production
    default: false
    workspace:
      host: https://adb-7405615519498491.11.azuredatabricks.net/

resources:
  pipelines:
    banking_bronze_dlt:
      name: banking-bronze-declarative-pipeline
      catalog: banking_prod
      schema: banking_bronze
      serverless: true
      continuous: false    # -> change to autoretry on error
      libraries:
        - notebook:
            path: ./databricks/streaming-bronze-load/bronze_transaction_stream.py
      configuration:
        eh_namespace: "banking-lakehouse-eventhub-transactions"
        eh_txn_name: "transactioneventhub"

    banking_silver_dlt:
      name: banking-silver-declarative-pipeline
      catalog: banking_prod
      schema: banking_silver
      serverless: true
      continuous: true
      libraries:
        - notebook:
            path: ./databricks/streaming-silver-load/silver_transaction_stream.py

  jobs:
    banking_bronze_dlt_job:
      name: banking-bronze-dlt-trigger
      max_concurrent_runs: 1
      tasks:
        - task_key: run_dlt_pipeline
          max_retries: 0
          pipeline_task:
            pipeline_id: ${resources.pipelines.banking_bronze_dlt.id}

    banking_silver_dlt_job:
      name: banking-silver-dlt-trigger
      max_concurrent_runs: 1
      tasks:
        - task_key: run_dlt_silver_pipeline
          max_retries: 0
          pipeline_task:
            pipeline_id: ${resources.pipelines.banking_silver_dlt.id}

    banking_account_bronze_load:
      name: daily_account_load
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 23 ? * MON-FRI"
        timezone_id: "America/Monterrey"
        pause_status: UNPAUSED
      job_clusters:
        - job_cluster_key: batch_cluster
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            node_type_id: Standard_D4s_v3     
            num_workers: 1
            data_security_mode: SINGLE_USER       # 
            single_user_name: yashreyansh101@gmail.com  #  required for SINGLE_USER mode
            
      tasks:
        - task_key: account_load
          max_retries: 0
          job_cluster_key: batch_cluster
          spark_python_task:
            python_file: ./databricks/batch-bronze-load/batch_account_load.py